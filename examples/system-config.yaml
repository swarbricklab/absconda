# Absconda system-wide configuration
# Place this file at: /etc/xdg/absconda/config.yaml
#
# This file provides shared configuration for all users on the system.
# Users can override settings in ~/.config/absconda/config.yaml

# Container registry settings
registry: ghcr.io
organization: swarbricklab

# GHCR authentication for local `singularity pull` of private images.
# Opt-in: omit this block to leave pulls unauthenticated (the default).
# When enabled, the GHCR username/token are fetched from GCP Secret Manager at
# pull time and passed to singularity via SINGULARITY_DOCKER_*/APPTAINER_DOCKER_*
# environment variables (scoped to that subprocess only, never written to disk).
# Credentials already exported in the environment take precedence.
ghcr_auth:
  source: gcp-secret-manager            # only supported value; omit to disable
  user_secret: absconda-github-username # GCP secret holding the GHCR username
  token_secret: absconda-github-token   # GCP secret holding the GHCR PAT
  # Project is taken from gcp_project / $GCP_PROJECT above.

# GCP settings (override with GCP_PROJECT, GCP_REGION, GCP_ZONE env vars)
gcp_project: ctp-archive
gcp_region: australia-southeast1
gcp_zone: australia-southeast1-a

# Default policy profile
default_profile: default

# Remote builder definitions
remote_builders:
  gcp-builder:
    # SSH connection details (uses OS Login)
    host: absconda-builder
    workspace: /var/lib/absconda
    
    # GCP-specific metadata for gcloud commands
    project: ctp-archive
    zone: australia-southeast1-a
    
    # SSH options for IAP tunnel
    ssh_options:
      - "-o"
      - "ProxyCommand=gcloud compute start-iap-tunnel %h %p --listen-on-stdin --project=ctp-archive --zone=australia-southeast1-a --verbosity=warning"
      - "-o"
      - "StrictHostKeyChecking=no"
      - "-o"
      - "UserKnownHostsFile=/dev/null"
    
    # Lifecycle commands
    start_command:
      - "gcloud"
      - "compute"
      - "instances"
      - "start"
      - "absconda-builder"
      - "--zone=australia-southeast1-a"
      - "--project=ctp-archive"
    
    stop_command:
      - "gcloud"
      - "compute"
      - "instances"
      - "stop"
      - "absconda-builder"
      - "--zone=australia-southeast1-a"
      - "--project=ctp-archive"
    
    provision_command:
      - "terraform"
      - "apply"
      - "-auto-approve"
    
    health_command:
      - "docker"
      - "info"
