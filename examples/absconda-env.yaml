# Absconda container environment
# This environment packages absconda itself for HPC deployment
name: absconda
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # gcloud CLI for remote builder management
  - google-cloud-sdk
  # NumPy improves IAP tunnel upload bandwidth
  - numpy
  # SSH for connecting to remote builders
  - openssh
  # Git for cloning repos (optional but useful)
  - git
  - pip:
    # Install from GitHub main branch to get latest code
    - git+https://github.com/swarbricklab/absconda.git@main

# Baked into the image as ENV. gcloud runs its Python with -S and so ignores the
# numpy installed above (which speeds up IAP tunnels) unless site-packages are
# enabled. Setting this silences the "consider installing NumPy" warning on every
# remote-builder connection.
variables:
  CLOUDSDK_PYTHON_SITEPACKAGES: "1"
