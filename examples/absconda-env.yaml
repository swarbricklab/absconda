# Absconda container environment
# This environment packages absconda itself for HPC deployment
name: absconda
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # gcloud CLI for remote builder management
  - google-cloud-sdk
  # SSH for connecting to remote builders
  - openssh
  # Git for cloning repos (optional but useful)
  - git
  - pip:
    - absconda>=0.1.0
