name: Deploy to NCI

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: [self-hosted, qxub-runner]
    permissions:
      contents: read

    env:
      GCP_PROJECT: ctp-archive
      GCP_ZONE: australia-southeast1-a
      BUILDER_VM: absconda-builder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate gcloud
        env:
          GCP_SA_KEY: ${{ secrets.SERVICE_ACCOUNT }}
        run: |
          printenv GCP_SA_KEY > /tmp/gcp-sa-key.json
          gcloud auth activate-service-account \
            --key-file=/tmp/gcp-sa-key.json \
            --project=$GCP_PROJECT
          rm -f /tmp/gcp-sa-key.json

      - name: Start builder VM
        run: |
          gcloud compute instances start $BUILDER_VM \
            --zone=$GCP_ZONE --project=$GCP_PROJECT

      - name: Upload build context
        run: |
          tar -czf /tmp/context.tar.gz --exclude=.git .
          gcloud compute scp /tmp/context.tar.gz \
            $BUILDER_VM:/var/lib/absconda/context.tar.gz \
            --zone=$GCP_ZONE --project=$GCP_PROJECT \
            --tunnel-through-iap
          rm -f /tmp/context.tar.gz

      - name: Build and push image
        run: |
          IMAGE_REF="ghcr.io/swarbricklab/absconda:$(date +%Y%m%d)"
          gcloud compute ssh $BUILDER_VM \
            --zone=$GCP_ZONE --project=$GCP_PROJECT \
            --tunnel-through-iap \
            --command="mkdir -p /var/lib/absconda/build && \
              tar -xzf /var/lib/absconda/context.tar.gz -C /var/lib/absconda/build && \
              cd /var/lib/absconda/build && \
              DOCKER_BUILDKIT=1 docker build -t ${IMAGE_REF} . && \
              gcloud secrets versions access latest --secret=absconda-github-token | \
                docker login ghcr.io -u \$(gcloud secrets versions access latest --secret=absconda-github-username) --password-stdin && \
              docker push ${IMAGE_REF} && \
              docker logout ghcr.io"

      - name: Cleanup builder
        if: always()
        run: |
          gcloud compute ssh $BUILDER_VM \
            --zone=$GCP_ZONE --project=$GCP_PROJECT \
            --tunnel-through-iap \
            --command="rm -rf /var/lib/absconda/build /var/lib/absconda/context.tar.gz" || true

      - name: Stop builder VM
        if: always()
        run: |
          gcloud compute instances stop $BUILDER_VM \
            --zone=$GCP_ZONE --project=$GCP_PROJECT || true

      - name: Revoke gcloud credentials
        if: always()
        run: |
          gcloud auth revoke --all --quiet || true
