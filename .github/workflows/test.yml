name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
      fail-fast: false
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run tests
        run: pytest -v
      
      - name: Check code formatting
        run: |
          pip install ruff
          ruff check src/ tests/
          ruff format --check src/ tests/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      # Guard against a wheel that builds + twine-checks cleanly but can't load
      # its own bundled _templates once installed (issue #65). Install the wheel
      # into a throwaway venv and render a Dockerfile from outside the source
      # tree, so templates must resolve from site-packages, not the checkout.
      - name: Smoke-test installed wheel loads bundled templates
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --upgrade pip
          /tmp/wheeltest/bin/pip install dist/*.whl
          mkdir -p /tmp/wheelsmoke
          cat > /tmp/wheelsmoke/env.yaml <<'EOF'
          name: smoke
          channels: [conda-forge]
          dependencies:
            - python=3.11
          EOF
          cd /tmp/wheelsmoke
          /tmp/wheeltest/bin/absconda generate -f env.yaml -o Dockerfile.smoke
          grep -q "Generated by Absconda" Dockerfile.smoke
          grep -q "conda-pack" Dockerfile.smoke
